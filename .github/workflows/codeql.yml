name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  # A cancelled CodeQL run is recorded as an unsuccessful analysis. Let scans
  # finish so rapid pushes to main do not leave code scanning in a failed state.
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CodeQL only needs to extract our source. Building the large crypto
      # dependency before initialization keeps it out of the traced build.
      - name: Prebuild crypto dependency
        run: swift build --arch arm64 --target P256K

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Build Swift package
        run: swift build --arch arm64 --target SignstrCore

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
