name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-release
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      BUILD_NUMBER: ${{ github.run_number }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.MACOS_PROVISIONING_PROFILE_NAME }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release version and tag
        run: Scripts/verify-release-version.sh "$RELEASE_TAG"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; increment the version instead." >&2
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Build unsigned Release configurations
        run: |
          xcodebuild -project Signstr.xcodeproj -scheme SignstrMac -configuration Release -destination 'platform=macOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project Signstr.xcodeproj -scheme Signstr -configuration Release -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.TEMP_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/signstr.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Install Developer ID provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          profile_path="$RUNNER_TEMP/signstr.provisionprofile"
          profiles_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile_path"
          mkdir -p "$profiles_directory"
          cp "$profile_path" "$profiles_directory/signstr.provisionprofile"

      - name: Write App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APP_STORE_CONNECT_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, notarize, and validate DMG
        run: |
          Scripts/release-macos.sh | tee "$RUNNER_TEMP/release-output.txt"
          grep '^DMG_PATH=' "$RUNNER_TEMP/release-output.txt" >> "$GITHUB_ENV"
          grep '^CHECKSUM_PATH=' "$RUNNER_TEMP/release-output.txt" >> "$GITHUB_ENV"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          notes="Distribution/macOS/release-notes-$version.md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" "$DMG_PATH" "$CHECKSUM_PATH" \
            --title "Signstr $version" \
            --notes-file "$notes" \
            --prerelease \
            --verify-tag
