name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Swift tests with coverage
        run: swift test --enable-code-coverage

      - name: Generate coverage report
        run: |
          Scripts/generate-coverage-report.sh coverage-report
          cat coverage-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Browse the annotated coverage report](https://guaka.github.io/signstr/)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage-report
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload coverage site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: coverage-report

      - name: Build macOS app
        run: >-
          xcodebuild
          -project Signstr.xcodeproj
          -scheme SignstrMac
          -configuration Debug
          -destination 'platform=macOS'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build iOS app
        run: >-
          xcodebuild
          -project Signstr.xcodeproj
          -scheme Signstr
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          build

  deploy-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy coverage to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
